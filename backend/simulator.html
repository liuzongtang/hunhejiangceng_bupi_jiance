<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产线模拟器 — 织物瑕疵检测</title>
<style>
:root{
  --bg:#e8ebf0;--panel:#ffffff;--panel2:#f4f6f9;--border:#c9ced8;--border2:#dfe3ea;
  --text:#1b2333;--text2:#5b6472;--muted:#8a93a3;
  --accent:#1565c0;--green:#1e8e3e;--red:#d93025;--orange:#e8710a;--yellow:#b07d09;
  --num:'Consolas','JetBrains Mono','SF Mono','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Microsoft YaHei','Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;display:flex;flex-direction:column}

.header{background:#fff;border-bottom:3px solid var(--accent);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 1px 4px rgba(20,30,50,.08)}
.header .brand{display:flex;align-items:center;gap:12px}
.header .brand .logo{width:8px;height:32px;background:var(--accent);border-radius:2px}
.header h1{font-size:16px;font-weight:700;letter-spacing:1px;color:#12365f}
.header .sub{font-size:11px;color:var(--text2)}
.controls{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--text2)}
.controls button{padding:7px 18px;border-radius:3px;border:1px solid;cursor:pointer;font-size:13px;font-weight:700;transition:.15s}
.btn-start{background:var(--green);color:#fff;border-color:var(--green)}
.btn-start:hover:not(:disabled){filter:brightness(.92)}
.btn-stop{background:var(--red);color:#fff;border-color:var(--red)}
.btn-stop:hover:not(:disabled){filter:brightness(.92)}
button:disabled{opacity:.4;cursor:not-allowed}
.speed-slider{width:90px;accent-color:var(--accent)}
.speed-label{font-family:var(--num);font-weight:700;color:var(--accent);font-size:13px}

.main{display:grid;grid-template-columns:1fr 320px;gap:14px;padding:14px 20px;flex:1;min-height:0}

.cam-panel{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);position:relative;background-repeat:no-repeat;
  background-image:linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent));
  background-size:14px 2px,2px 14px,14px 2px,2px 14px,14px 2px,2px 14px,14px 2px,2px 14px;
  background-position:top left,top left,top right,top right,bottom left,bottom left,bottom right,bottom right}
.cam-panel .cam-title{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px;padding:12px 16px;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between}
.cam-panel .cam-title b{font-family:var(--num);color:var(--accent)}
.cam-panel .cam-title .rec{color:var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
.center{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0}
.fabric-stage{position:relative;width:640px;height:480px;max-width:100%;max-height:100%;border:2px solid #2c3138;border-radius:4px;overflow:hidden;background:#101418;box-shadow:0 2px 14px rgba(0,0,0,.28)}
.fabric-stage canvas{display:block}
.pipeline{display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 16px;font-size:11px;border-top:1px solid var(--border2);flex-shrink:0}
.pipe-step{background:var(--panel2);padding:4px 10px;border-radius:3px;color:var(--text2);border:1px solid var(--border2);font-weight:600;transition:.15s}
.pipe-arrow{color:var(--accent)}
.pipe-step.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.sidebar{display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0}
.panel-frame{background:var(--panel);border:1px solid var(--border);padding:14px 16px;background-repeat:no-repeat;
  background-image:linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent));
  background-size:12px 2px,2px 12px,12px 2px,2px 12px,12px 2px,2px 12px,12px 2px,2px 12px;
  background-position:top left,top left,top right,top right,bottom left,bottom left,bottom right,bottom right}
.panel-frame h3{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:7px}
.panel-frame h3::before{content:"";width:4px;height:13px;background:var(--accent);border-radius:1px}
.stat-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--border2)}
.stat-row:last-child{border-bottom:none}
.stat-row .lbl{color:var(--text2)}
.stat-row .val{font-weight:700;font-family:var(--num);font-variant-numeric:tabular-nums}
.stat-row .val.green{color:var(--green)}.stat-row .val.red{color:var(--red)}.stat-row .val.accent{color:var(--accent)}
.alert-mini{padding:7px 9px;border-radius:3px;font-size:11px;border-left:3px solid;margin-bottom:5px;background:#fff;border:1px solid var(--border2);border-left-width:3px}
.alert-mini.critical{border-left-color:var(--red);background:#fff5f5}
.alert-mini.major{border-left-color:var(--orange);background:#fff8f0}
.alert-mini.medium{border-left-color:var(--yellow)}
.alert-mini.minor{border-left-color:var(--accent)}

.statusbar{background:#fff;border-top:2px solid var(--accent);padding:8px 20px;display:flex;align-items:center;gap:22px;font-size:12px;color:var(--text2);flex-shrink:0}
.statusbar .stat-item{display:flex;align-items:center;gap:7px}
.statusbar .stat-item b{color:var(--text);font-family:var(--num);font-size:13px;font-variant-numeric:tabular-nums}
.statusbar .stat-item .lbl{color:var(--muted)}
.statusbar .spacer{flex:1}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="logo"></div>
    <div>
      <h1>产线模拟器</h1>
      <div class="sub">PRODUCTION LINE SIMULATOR · RT-DETR 真实测试集</div>
    </div>
  </div>
  <div class="controls">
    <span>线速</span>
    <input type="range" class="speed-slider" min="1" max="20" value="5" id="speed" oninput="document.getElementById('speedVal').textContent=this.value">
    <span class="speed-label" id="speedVal">5</span>
    <button class="btn-start" onclick="startSim()" id="btnStart">▶ 开始</button>
    <button class="btn-stop" onclick="stopSim()" id="btnStop" disabled>■ 停止</button>
  </div>
</div>

<div class="main">
<div class="cam-panel">
  <div class="cam-title">
    <span>实时画面 · CAM-001 · <span class="rec">● REC</span></span>
    <b id="camInfo">加载中…</b>
  </div>
  <div class="center">
    <div class="fabric-stage" id="stage">
      <canvas id="fabricCanvas" width="640" height="480"></canvas>
    </div>
  </div>
  <div class="pipeline" id="pipeline">
    <span class="pipe-step" id="step1">图像采集</span><span class="pipe-arrow">→</span>
    <span class="pipe-step" id="step2">预处理</span><span class="pipe-arrow">→</span>
    <span class="pipe-step" id="step3">推理检测</span><span class="pipe-arrow">→</span>
    <span class="pipe-step" id="step4">图像存储</span><span class="pipe-arrow">→</span>
    <span class="pipe-step" id="step5">告警推送</span>
  </div>
</div>

<div class="sidebar">
  <div class="panel-frame"><h3>产线状态</h3>
    <div class="stat-row"><span class="lbl">线速度</span><span class="val accent" id="lineSpeed">45.6 m/min</span></div>
    <div class="stat-row"><span class="lbl">状态</span><span class="val green" id="lineStatus">就绪</span></div>
    <div class="stat-row"><span class="lbl">数据集</span><span class="val" id="datasetInfo">--</span></div>
  </div>
  <div class="panel-frame"><h3>检测统计</h3>
    <div class="stat-row"><span class="lbl">检测帧</span><span class="val accent" id="imgCount">0</span></div>
    <div class="stat-row"><span class="lbl">检出缺陷</span><span class="val red" id="defCount">0</span></div>
    <div class="stat-row"><span class="lbl">缺陷率</span><span class="val" id="defRate">0%</span></div>
  </div>
  <div class="panel-frame"><h3>告警推送</h3><div id="alertFeed" style="max-height:180px;overflow-y:auto"><span style="color:var(--text2)">等待中...</span></div></div>
  <div class="panel-frame"><h3>缺陷类型分布</h3><div id="defectTypes"></div></div>
</div>
</div>

<div class="statusbar">
  <div class="stat-item"><span class="lbl">线速</span><b id="sb-speed">-- m/min</b></div>
  <div class="stat-item"><span class="lbl">状态</span><b id="sb-status" style="color:var(--green)">就绪</b></div>
  <div class="stat-item"><span class="lbl">检测帧</span><b id="sb-img">0</b></div>
  <div class="stat-item"><span class="lbl">缺陷</span><b id="sb-def" style="color:var(--red)">0</b></div>
  <div class="stat-item"><span class="lbl">缺陷率</span><b id="sb-rate">0%</b></div>
  <div class="spacer"></div>
  <div class="stat-item"><span class="lbl">时间</span><b id="sb-clock">--</b></div>
</div>

<script>
const canvas=document.getElementById('fabricCanvas');
const ctx=canvas.getContext('2d');
const W=640,H=480;

const SEV_COLOR={critical:'#d93025',major:'#e8710a',medium:'#b07d09',minor:'#1565c0',info:'#5b6472'};
const SEV_NAMES={critical:'严重',major:'主要',medium:'中等',minor:'轻微',info:'提示'};

let running=false,frameCount=0,defCount=0,defectiveFrames=0;
let defTypes={},typeZh={};
let names=[],idx=0;
let current=null,next=null,nextIndex=0,panX=0,loading=false;

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function pick(i){return names[((i%names.length)+names.length)%names.length];}
function scrollSpeed(){return parseInt(document.getElementById('speed').value)*1.2;}
function lineSpeed(){return (40+parseInt(document.getElementById('speed').value)*3).toFixed(1);}

function loadImage(name){return new Promise((res)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src='/api/v1/simulator/image/'+encodeURIComponent(name);});}
function loadDetect(name){return fetch('/api/v1/simulator/detect/'+encodeURIComponent(name)).then(r=>r.json()).then(j=>j.detections||[]);}

function activate(slot,i){
  current={name:slot.name,img:slot.img,dets:slot.dets};
  current.scale=H/current.img.height;
  current.dispW=current.img.width*current.scale;
  current.panMax=Math.max(0,current.dispW-W);
  panX=0;idx=i;
  onActivate();
  prefetch(i+1);
}

function prefetch(i){
  const name=pick(i);nextIndex=i;
  next={name:name,img:null,dets:null};
  loadImage(name).then(im=>{if(nextIndex===i)next.img=im;});
  loadDetect(name).then(d=>{if(nextIndex===i)next.dets=d;});
}

function onActivate(){
  frameCount++;
  const dets=current.dets||[];
  defCount+=dets.length;
  if(dets.length>0){defectiveFrames++;flashPipeline();}
  for(const d of dets){
    defTypes[d.type]=(defTypes[d.type]||0)+1;
    typeZh[d.type]=d.zh;
    if(d.severity==='critical'||d.severity==='major')addAlert(d);
  }
  updateUI();
}

function flashPipeline(){
  for(let n=1;n<=5;n++){
    setTimeout(()=>{document.getElementById('step'+n).classList.add('active');},(n-1)*80);
    setTimeout(()=>{document.getElementById('step'+n).classList.remove('active');},(n-1)*80+160);
  }
}

function addAlert(d){
  const feed=document.getElementById('alertFeed');
  if(feed.querySelector('span'))feed.innerHTML='';
  const div=document.createElement('div');
  div.className='alert-mini '+d.severity;
  div.innerHTML='<b>'+(d.zh||d.type)+'</b> <span style="font-family:var(--num);color:var(--muted)">'+d.code+'</span><br><span style="color:var(--text2);font-size:10px">'+SEV_NAMES[d.severity]+' | 置信 '+Math.round(d.confidence*100)+'% | 帧 '+frameCount+'</span>';
  feed.insertBefore(div,feed.firstChild);
  if(feed.children.length>15)feed.removeChild(feed.lastChild);
}

function updateUI(){
  const rate=frameCount?((defectiveFrames/frameCount)*100).toFixed(1):'0.0';
  document.getElementById('imgCount').textContent=frameCount;
  document.getElementById('defCount').textContent=defCount;
  document.getElementById('defRate').textContent=rate+'%';
  document.getElementById('datasetInfo').textContent='测试集 '+names.length+' 张';
  document.getElementById('lineSpeed').textContent=lineSpeed()+' m/min';
  document.getElementById('camInfo').textContent='帧 '+String(frameCount).padStart(5,'0')+' · '+(current?current.name.slice(0,12)+'…':'--')+' · '+lineSpeed()+' m/min';
  document.getElementById('sb-img').textContent=frameCount;
  document.getElementById('sb-def').textContent=defCount;
  document.getElementById('sb-rate').textContent=rate+'%';
  document.getElementById('sb-speed').textContent=lineSpeed()+' m/min';
  const types=Object.entries(defTypes).sort((a,b)=>b[1]-a[1]);
  document.getElementById('defectTypes').innerHTML=types.map(([t,c])=>'<div style="display:flex;justify-content:space-between;font-size:12px;margin:3px 0;padding:2px 0;border-bottom:1px dashed var(--border2)"><span>'+(typeZh[t]||t)+'</span><span style="font-family:var(--num);color:var(--accent);font-weight:700">'+c+'</span></div>').join('')||'<span style="color:var(--text2)">--</span>';
}

function drawBox(g,x,y,w,h,sev,label){
  const color=SEV_COLOR[sev]||SEV_COLOR.info;
  g.strokeStyle=color;g.lineWidth=2;g.strokeRect(x,y,w,h);
  g.font='11px Microsoft YaHei';const tw=g.measureText(label).width;
  g.fillStyle=color;g.fillRect(x,Math.max(0,y-16),tw+8,16);
  g.fillStyle='#fff';g.fillText(label,x+4,Math.max(11,y-4));
}

function draw(){
  ctx.fillStyle='#101418';ctx.fillRect(0,0,W,H);
  if(!current){
    ctx.fillStyle='#8a93a3';ctx.font='13px Microsoft YaHei';ctx.textAlign='center';
    ctx.fillText(loading?'加载测试集与模型…':'就绪，点击「开始」',W/2,H/2);
    ctx.textAlign='left';
    return;
  }
  // horizontal pan across the fabric strip (camera scanning along the cloth)
  ctx.drawImage(current.img,0,0,current.img.width,current.img.height,-panX,0,current.dispW,H);
  for(const d of current.dets){
    const sx=d.bbox[0]*current.scale-panX;
    const sy=d.bbox[1]*current.scale;
    const sw=d.bbox[2]*current.scale;
    const sh=d.bbox[3]*current.scale;
    if(sx+sw<0||sx>W)continue;
    const label=(d.zh||d.type)+' '+Math.round(d.confidence*100)+'%';
    drawBox(ctx,sx,sy,sw,sh,d.severity,label);
  }
  // scan window hint
  ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(0,0,W,2);ctx.fillRect(0,H-2,W,2);
}

function frame(){
  if(!running)return;
  if(!current)return;
  panX+=scrollSpeed();
  if(panX>=current.panMax){
    if(next&&next.img&&next.dets){
      const slot=next;next=null;activate(slot,nextIndex);
    }else{
      panX=current.panMax; // hold while next frame prefetches
    }
  }
  draw();
  requestAnimationFrame(frame);
}

function startSim(){
  if(!current)return;
  running=true;
  document.getElementById('btnStart').disabled=true;
  document.getElementById('btnStop').disabled=false;
  document.getElementById('lineStatus').textContent='运行中';document.getElementById('lineStatus').className='val green';
  document.getElementById('sb-status').textContent='运行中';document.getElementById('sb-status').style.color='var(--green)';
  requestAnimationFrame(frame);
}

function stopSim(){
  running=false;
  document.getElementById('btnStart').disabled=false;
  document.getElementById('btnStop').disabled=true;
  document.getElementById('lineStatus').textContent='已停止';document.getElementById('lineStatus').className='val red';
  document.getElementById('sb-status').textContent='已停止';document.getElementById('sb-status').style.color='var(--red)';
}

function init(){
  loading=true;draw();
  fetch('/api/v1/simulator/images').then(r=>r.json()).then(j=>{
    names=shuffle(j.images||[]);
    document.getElementById('datasetInfo').textContent='测试集 '+names.length+' 张';
    if(names.length===0){loading=false;draw();document.getElementById('camInfo').textContent='无测试集图片';return;}
    const name=pick(0);nextIndex=0;
    Promise.all([loadImage(name),loadDetect(name)]).then(([img,dets])=>{
      loading=false;
      if(!img){document.getElementById('camInfo').textContent='图像加载失败';draw();return;}
      activate({name:name,img:img,dets:dets},0);
      draw();
    });
  });
}

function updateClock(){document.getElementById('sb-clock').textContent=new Date().toLocaleString();}

draw();init();
setInterval(updateClock,1000);
</script>
</body>
</html>
