[project]
name = "mixed-reward-rlhf"
version = "1.0.0"
description = "Fabric Defect Detection — CV + Hybrid Reward + Real-time Monitoring"
requires-python = ">=3.10"
license = { text = "MIT" }

# ============================================================================
# Ruff — Linter
# ============================================================================

[tool.ruff]
target-version = "py310"

# Paths to include/exclude
exclude = [
    "__pycache__",
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    "dist",
    "build",
    "*.egg-info",
    "deploy/",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes (undefined names, unused imports, etc.)
    "I",     # isort (import ordering)
    "B",     # flake8-bugbear (common bugs)
    "C4",    # flake8-comprehensions (unnecessary list/dict/set calls)
    "SIM",   # flake8-simplify (simplifiable expressions)
    "TCH",   # flake8-type-checking (move imports behind TYPE_CHECKING)
    "RUF",   # Ruff-specific rules
]

ignore = [
    "E501",   # Line too long — formatter handles this
    "B008",   # Do not perform function calls in argument defaults — noisy with FastAPI Depends
    "SIM108", # Use ternary operator — style preference
    "TC001",  # Move application import to type-checking block — too aggressive
    "TC002",  # Move third-party import to type-checking block
    "TC003",  # Move standard library import to type-checking block
    "F821",   # Undefined name in string annotations ("torch.nn.Module", etc.) — intentional for optional deps
    "E402",   # Module import not at top of file — intentional for optional dependency imports
    "RUF001", # Ambiguous unicode characters — Chinese punctuation is intentional in this project
    "RUF002", # Ambiguous unicode in docstrings — Chinese text is intentional
    "RUF012", # Mutable class defaults — used as read-only constants (DEFECT_CLASSES, etc.)
]

# Fixable rules (auto-fix safe)
fixable = ["ALL"]

# Per-module rule overrides
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # Use of assert — fine in tests
    "ARG001", # Unused function argument — fixtures often have unused params
]

# ============================================================================
# Ruff — Formatter
# ============================================================================

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
line-ending = "auto"

# ============================================================================
# isort (via Ruff)
# ============================================================================

[tool.ruff.lint.isort]
known-first-party = ["backend", "mixed_reward"]
force-sort-within-sections = true
combine-as-imports = true

# ============================================================================
# Pytest
# ============================================================================

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests", "backend/training/tests", "backend/inference/tests", "backend/deploy/tests"]
pythonpath = ["."]
# asyncio_mode = "auto" — omit to avoid forcing async for sync tests

# ============================================================================
# Coverage
# ============================================================================

[tool.coverage.run]
source = ["backend", "mixed_reward"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]
