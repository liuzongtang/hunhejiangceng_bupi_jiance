# ============================================================================
# Mixed Reward + GRPO Configuration
# ============================================================================
# Uses GRPO (Group Relative Policy Optimization) as the base algorithm.
# GRPO does not require a critic model, making it more memory-efficient.
#
# Usage:
#   python scripts/train_mixed_reward.py --mode verl --config configs/mixed_reward_grpo.yaml
# ============================================================================

defaults:
  - _self_

# ============================================================================
# Model Configuration
# ============================================================================
model:
  path: "Qwen/Qwen2.5-1.5B-Instruct"
  tokenizer_path: null  # Uses model.path if null
  trust_remote_code: true

# ============================================================================
# Algorithm Configuration
# ============================================================================
algorithm:
  # Use GRPO (no critic needed)
  adv_estimator: "grpo"

  # PPO clipping
  clip_ratio: 0.2

  # KL control
  use_kl_in_reward: true
  kl_penalty: "kl"
  kl_coef: 0.01

  # GRPO-specific: number of samples per prompt
  grpo:
    n_samples: 4

# ============================================================================
# Training Configuration
# ============================================================================
training:
  total_epochs: 1
  total_training_steps: 1000
  save_freq: 100
  eval_freq: 50

  # Batch settings
  batch_size: 32
  mini_batch_size: 8

  # Optimizer
  optimizer:
    lr: 1.0e-6
    betas: [0.9, 0.999]
    weight_decay: 0.01

  # Learning rate schedule
  lr_scheduler: "cosine"
  warmup_steps: 50

  # Gradient
  max_grad_norm: 1.0

# ============================================================================
# Mixed Reward Configuration
# ============================================================================
mixed_reward:
  enabled: true

  # Reward dimensions (must match scorers in mixed_reward.scoring)
  dimensions:
    - accuracy
    - safety
    - completeness
    - format

  # Scalar weights for R_total = Σ(w_i * r_i)
  weights: [1.0, 1.0, 0.5, 0.5]

  # β: Modulation strength — higher = more dimension influence
  beta: 0.1

  # Dimension state configuration
  dimension_state:
    init_value: 1.0
    d_min: 0.5
    d_max: 2.0
    forget_factor: 0.999
    learning_rate: 0.01
    use_baseline: true
    baseline_momentum: 0.99

  # Modulation settings
  modulation:
    modulate_advantages: true
    per_param_group: true

# ============================================================================
# Reward Function (verl plugin)
# ============================================================================
custom_reward_function:
  path: "mixed_reward.reward_manager.multi_dimensional"
  name: "compute_multi_dimensional_score"
  reward_kwargs:
    dimensions: ["accuracy", "safety", "completeness", "format"]
    weights: [1.0, 1.0, 0.5, 0.5]

# ============================================================================
# Visualization
# ============================================================================
visualization:
  wandb:
    enabled: true
    project: "mixed-reward-rlhf"
    entity: null
  tensorboard:
    enabled: true
    log_dir: "./runs/mixed_reward_grpo"
  log_interval: 10
  heatmap_interval: 100

# ============================================================================
# Experiment Metadata
# ============================================================================
experiment:
  name: "exp_b_dynamic"
  description: "Full mixed reward mechanism (scalar + dynamic D)"
  seed: 42
